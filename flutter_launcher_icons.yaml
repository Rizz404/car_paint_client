flutter_launcher_icons:
  # Untuk sementara tetap gunakan PNG yang dikonversi dari SVG
  image_path: "assets/images/logo/new_logo.png" # Konversi dari SVG
  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo/new_logo.png" # Konversi dari SVG
  ios: true
  remove_alpha_channel_ios: true
  web:
    generate: true
    image_path: "assets/images/logo/new_logo.png" # Konversi dari SVG
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/images/logo/new_logo.png" # Konversi dari SVG
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/logo/new_logo.png" # Konversi dari SVG
